name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Fabric & NeoForge
        run: ./gradlew :fabric:build :neoforge:build --no-daemon

      - name: Collect release jars
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp fabric/build/libs/more-mooncake-fabric-${VER}.jar dist/
          cp neoforge/build/libs/more-mooncake-neoforge-${VER}.jar dist/
          ls -la dist/

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: more-mooncake-jars
          path: dist/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
